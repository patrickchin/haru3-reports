name: Mobile v3 Tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "apps/mobile-v3/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-v3-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/mobile-v3/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-v3-tests.yml"

permissions:
  contents: read

concurrency:
  group: mobile-v3-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter mobile-v3 test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-v3-coverage
          path: apps/mobile-v3/coverage
          retention-days: 14
          if-no-files-found: ignore
