# Camera capture → discard the pending row before it completes
#
# Verifies the queue's `cancelUpload` path is wired up to the in-row
# discard chip. Race-y on a fast network (the upload may finish before
# the user can tap Discard) so we pre-empt by tapping the chip on the
# very next frame after the pending row appears. If the upload still
# wins, the assertion at the bottom (no `pending-photo-queue-.*`
# remaining) passes either way — that's the user-visible contract.
appId: com.harpa.pro
tags:
  - files
  - upload-queue
  - positive
env:
  PROJECT_NAME: "Discard Pending Photo"
  PROJECT_ADDRESS: "301 Queue Way"
  CLIENT_NAME: "Queue Client"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

- tapOn:
    id: "btn-camera-capture"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-camera-shutter"
    timeout: 5000
- tapOn:
    id: "btn-camera-shutter"
- waitForAnimationToEnd
- tapOn:
    id: "btn-camera-done"
- waitForAnimationToEnd

# Switch to Notes/Edit tab where pending rows render.
- tapOn:
    id: "btn-tab-notes"
    optional: true
- waitForAnimationToEnd

# Pending row appears, then we discard it. In fixture mode the upload
# can complete before the discard chip is reachable; we mark the wait
# and the discard tap optional so the flow falls through to the
# user-visible contract: no pending row remains afterwards (whether
# because we discarded it or because the upload won the race).
- extendedWaitUntil:
    visible:
      id: "pending-photo-queue-.*"
    timeout: 5000
    optional: true
- tapOn:
    id: "pending-photo-discard-queue-.*"
    optional: true
- waitForAnimationToEnd

# After discard the pending row is gone. The btn-open-file row may or
# may not exist depending on which side of the race won.
- assertNotVisible:
    id: "pending-photo-queue-.*"

- runFlow: ../subflows/assert-no-error.yaml

# Cleanup: report editor → reports list → project overview.
- tapOn:
    id: "btn-back"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
    optional: true
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
