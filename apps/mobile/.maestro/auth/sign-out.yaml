# Sign Out: Tap sign-out from profile and land on login
appId: com.harpa.pro
tags:
  - auth
  - positive
---
- runFlow: ../subflows/signup-or-login-mike.yaml

# Navigate to profile tab
- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd
# Sign Out lives below the Developer section on the profile screen, so
# scroll until the button is on-screen before tapping. The
# extendedWaitUntil-only assertion fails on devices where the button is
# below the fold (the developer panel pushes it off-screen on shorter
# viewports).
- scrollUntilVisible:
    element:
      id: "btn-sign-out"
    direction: DOWN
    speed: 80
    timeout: 10000
    visibilityPercentage: 30

- tapOn:
    id: "btn-sign-out"
- waitForAnimationToEnd

# Should land on login screen
- extendedWaitUntil:
    visible: "Phone Number"
    timeout: 8000
