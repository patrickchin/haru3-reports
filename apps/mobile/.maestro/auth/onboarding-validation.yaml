# Onboarding: Validation on company fields
# Uses +15550000004, an unseeded number whose OTP fixture is configured in
# supabase/config.toml. On first login the auth user is auto-provisioned
# without a profile row, so the onboarding screen renders fresh. Charlie's
# +15550000003 is seeded WITH a profile (see supabase/seed.sql) and bypasses
# onboarding entirely, which is why this flow used to land on the projects
# screen instead.
appId: com.harpa.pro
tags:
  - auth
  - negative
---
- runFlow: ../subflows/ensure-logged-out.yaml

# Login with a fresh number that will need onboarding
- tapOn:
    id: "input-phone"
- eraseText:
    charactersToErase: 20
- inputText: "+15550000004"
- tapOn:
    point: "50%,25%"
- tapOn: "Send Code"

- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 3000
- tapOn:
    id: "input-otp"
- inputText: "888888"
- tapOn:
    point: "50%,25%"
- tapOn: "Verify Code"

# Wait for onboarding screen
- extendedWaitUntil:
    visible:
      id: "screen-onboarding"
    timeout: 5000

# Submit with empty fields → validation errors
- tapOn:
    point: "50%,25%"
- tapOn: "Get Started"
- extendedWaitUntil:
    visible: ".*enter your full name.*"
    timeout: 3000
