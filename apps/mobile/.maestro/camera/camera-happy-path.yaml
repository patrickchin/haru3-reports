# Camera: capture a single photo via the in-app modal and confirm it
# attaches to the current report draft.
#
# Note: requires the simulator/emulator to have already granted camera
# permission to com.harpa.pro. The first run on a fresh device will hit
# the permission prompt and this flow will fail at the shutter step;
# rerun once the OS prompt is dismissed.
appId: com.harpa.pro
tags:
  - camera
  - positive
env:
  PROJECT_NAME: "Camera Happy"
  PROJECT_ADDRESS: "1 Camera Way"
  CLIENT_NAME: "Camera Client"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Open the actions menu and pick "Add photo" — this launches the in-app
# camera modal, NOT the system ImagePicker.
- tapOn:
    id: "btn-camera-capture"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-camera-shutter"
    timeout: 5000

# Burst: take two photos to exercise the multi-shot path.
- tapOn:
    id: "btn-camera-shutter"
- waitForAnimationToEnd
- tapOn:
    id: "btn-camera-shutter"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "2 photos"
    timeout: 3000

# Done returns to the report; the optimistic rows should appear shortly
# (upload itself runs in fixture mode against the mock backend).
- tapOn:
    id: "btn-camera-done"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-camera-capture"
    timeout: 5000

- runFlow: ../subflows/assert-no-error.yaml

# Cleanup
- tapOn:
    id: "btn-back"
    optional: true
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
