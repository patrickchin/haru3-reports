# Voice Notes: A voice-note row persists when the report screen unmounts
# mid-transcription.
#
# Regression for commit d4cb804 — previously, navigating away after
# tapping stop but before the transcript came back caused the row to
# be lost (the in-memory machine state was the only source of truth).
# After the fix, the row is written to report_notes immediately on stop
# and survives unmount + remount.
#
# Prerequisite: build with EXPO_PUBLIC_E2E_MOCK_VOICE_NOTE=true (see
# docs/09-testing.md § Voice-note flows).
appId: com.harpa.pro
tags:
  - voice-notes
  - positive
env:
  PROJECT_NAME: "VN Persist"
  PROJECT_ADDRESS: "14 Persist Pl"
  CLIENT_NAME: "Mike Persist"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Record a voice note.
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"

# Immediately leave the report screen, before the transcript can land.
# This unmounts the voice-note machine while transcription is in flight.
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

# We are now on the reports list. Re-enter the same draft report.
- extendedWaitUntil:
    visible:
      id: "report-row-draft-0"
    timeout: 5000
- tapOn:
    id: "report-row-draft-0"
- waitForAnimationToEnd

# Notes tab and assert the row is still there. The transcript may or
# may not have completed depending on timing, but the voice-note row
# must be present in the timeline (the fix from d4cb804).
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- assertVisible:
    id: "note-timeline"
- assertVisible:
    id: "voice-note-card-.*"

# Wait for the transcript to land (fixture path completes regardless of
# which screen is mounted) so cleanup leaves no in-flight work.
- extendedWaitUntil:
    visible: "Mocked voice note for E2E"
    timeout: 15000

# Clean up
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
