# Voice Notes: Only one voice note plays at a time.
#
# Regression for commit a0c16e1 — starting playback on a second card
# must stop playback on the first. There is no dedicated "is-playing"
# testID per card yet; the only externally-observable signal is the
# pause icon swap and absence of a player error. We therefore drive
# the interaction and assert no errors + both cards still rendered.
# See "Missing testIDs" note for a follow-up to expose a "playing"
# indicator testID for stronger assertions.
#
# Prerequisite: build with EXPO_PUBLIC_E2E_MOCK_VOICE_NOTE=true (see
# docs/09-testing.md § Voice-note flows).
appId: com.harpa.pro
tags:
  - voice-notes
  - positive
env:
  PROJECT_NAME: "VN Coord"
  PROJECT_ADDRESS: "13 Coord Way"
  CLIENT_NAME: "Mike Coord"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# First voice note.
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"

# Wait briefly so the second recording gets a distinct timestamp / id.
- extendedWaitUntil:
    visible:
      id: "btn-record-start"
    timeout: 5000

# Second voice note.
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"

# Notes tab, wait for both transcripts.
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "voice-note-transcript-.*"
    timeout: 60000

# Tap play on the first card.
- tapOn:
    id: "btn-voice-note-play-.*"
    index: 0

# Tap play on the second card — coordinator should stop the first.
- tapOn:
    id: "btn-voice-note-play-.*"
    index: 1

# Neither player should be in an error state.
- assertNotVisible: "Could not play"
- assertNotVisible: "Could not load"

# Both voice-note cards still rendered.
- assertVisible:
    id: "voice-note-card-.*"

# Clean up
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
