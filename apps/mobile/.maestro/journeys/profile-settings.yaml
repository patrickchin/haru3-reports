# Journey: Profile & Settings
#
# Trimmed companion to core-end-to-end.yaml. Profile is mostly read-only
# but has a recurring back-navigation bug class (R-pattern in
# docs/bugs/README.md), so we keep these scenarios in the journey suite.
#
# Covers:
#   - Account Details screen (testIDs all present)
#   - AI model picker (Developer section, model id reflected back)
#   - Clear-cache action with themed AppDialogSheet (NOT iOS Alert)
#   - Single-back from profile -> Projects (regression)
#   - Back-from-deep-screen: project -> profile -> back stays on project
#
# Dropped (covered by granular flows or low-value):
#   - Charlie usage-empty-state (low signal)
#   - Repeated 5x back-cycle (overkill for journey suite)
#   - Notifications row tap (no real assertion)
#   - Usage populated (granular)
#
# Persona: Mike (deep-link).
appId: com.harpa.pro
tags:
  - journey
  - profile
  - skip-release
---

- runFlow: ../subflows/signup-or-login-mike.yaml
- assertVisible: "Projects"

# === Section A: Single-back regression =========================================
- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd
- assertVisible: "Mike Torres"
- assertVisible: "Torres Construction LLC"

- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- assertVisible: "Projects"
- assertNotVisible: "Mike Torres"

# === Section B: Account Details ===============================================
- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd
- tapOn:
    text: "Account Details"
- waitForAnimationToEnd
- assertVisible:
    id: "screen-account"
- assertVisible:
    id: "profile-display-name"
- assertVisible:
    id: "profile-phone"
- assertVisible:
    id: "profile-company-name"
    optional: true
- assertVisible:
    id: "build-info"
- assertVisible:
    id: "server-info"
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- assertVisible: "Mike Torres"

# === Section C: AI model picker ===============================================
- scrollUntilVisible:
    element:
      id: "developer-section"
    direction: DOWN
    speed: 60
    timeout: 5000
- assertVisible:
    id: "ai-model-id"
- tapOn:
    id: "btn-open-ai-model"
- waitForAnimationToEnd
- assertVisible:
    text: ".*GPT.*|.*Claude.*|.*Kimi.*"
# Two-step picker: pick provider, then pick a stable model label.
- tapOn: "Kimi"
- waitForAnimationToEnd
- tapOn: "Kimi K2.6"
- waitForAnimationToEnd
- assertVisible:
    id: "ai-model-id"

# === Section D: Clear cache (themed dialog regression) ========================
- scrollUntilVisible:
    element:
      id: "btn-clear-cache"
    direction: DOWN
    speed: 60
    timeout: 5000
- tapOn:
    id: "btn-clear-cache"
- waitForAnimationToEnd
# MUST be themed AppDialogSheet, not Alert.alert
- assertVisible:
    id: "dialog-sheet"
- tapOn:
    text: "Clear cache|Clear cached data|Confirm"
- waitForAnimationToEnd
- runFlow: ../subflows/assert-no-error.yaml

# Back to Projects
- tapOn:
    id: "btn-back"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Mike Torres"
    commands:
      - tapOn:
          id: "btn-back"
      - waitForAnimationToEnd
- assertVisible: "Projects"

# === Section E: Back-from-deep-screen regression ==============================
# Drill into seeded Highland Tower, open profile (push), single back must
# return to project detail (not Projects list).
- extendedWaitUntil:
    visible: ".*Highland Tower Complex.*"
    timeout: 15000
- tapOn: ".*Highland Tower Complex.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Total reports"
    timeout: 30000

- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd
- assertVisible: "Mike Torres"

- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- assertVisible: "Total reports"
- assertNotVisible: "Mike Torres"
