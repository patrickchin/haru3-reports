# Journey: Cross-user RLS (over the wire)
#
# Verifies the Mike <-> Sarah RLS contract end-to-end against a real DB.
# This is the only journey that swaps users mid-flow.
#
# Verifies:
#   - A non-owner member sees a project after being added
#   - The non-owner sees the correct owner label (not themselves)
#   - Removing the member hides the project from their list
#
# Strategy: create a fresh "RLS Probe" project (so we don't perturb the
# seeded membership graph), pivot Sarah onto it, verify, remove, delete.
#
# Persona: Mike (deep-link), Sarah (deep-link), Mike (deep-link).
appId: com.harpa.pro
tags:
  - journey
  - cross-user
  - rls
  - skip-release
---

# === Section A: Mike creates probe + adds Sarah ===============================
- runFlow: ../subflows/signup-or-login-mike.yaml
- extendedWaitUntil:
    visible:
      id: "project-row-0"
    timeout: 30000

- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "RLS Probe"
      PROJECT_ADDRESS: "1 RLS Ave"
      CLIENT_NAME: "RLS Co"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "RLS Probe"
    timeout: 10000

# Add Sarah by phone, role = Editor
- tapOn:
    id: "btn-open-members"
- waitForAnimationToEnd
- tapOn:
    id: "btn-add-member"
- waitForAnimationToEnd
- tapOn:
    id: "input-member-phone"
- inputText: "+15559876543"
- hideKeyboard
- tapOn: "Editor"
- tapOn:
    id: "btn-submit-member"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sarah Chen"
    timeout: 8000

# === Section B: Sarah sees the project + correct owner ========================
- runFlow: ../subflows/signup-or-login-sarah.yaml
- extendedWaitUntil:
    visible: "Projects"
    timeout: 15000

- extendedWaitUntil:
    visible: "RLS Probe"
    timeout: 30000
- tapOn: "RLS Probe"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Total reports"
    timeout: 30000

# Open members; owner is Mike, Sarah is in the list
- tapOn:
    id: "btn-open-members"
- waitForAnimationToEnd
- assertVisible: "Mike Torres"
- assertVisible: "Owner"
- assertVisible: "Sarah Chen"

# === Section C: Mike removes Sarah ============================================
- runFlow: ../subflows/signup-or-login-mike.yaml
- extendedWaitUntil:
    visible: "RLS Probe"
    timeout: 30000
- tapOn: "RLS Probe"
- waitForAnimationToEnd
- tapOn:
    id: "btn-open-members"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sarah Chen"
    timeout: 5000
- tapOn:
    text: "Remove member"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "dialog-sheet"
    timeout: 5000
- tapOn:
    id: "dialog-action-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: "Sarah Chen"
    timeout: 5000

# === Section D: Sarah no longer sees the project ==============================
- runFlow: ../subflows/signup-or-login-sarah.yaml
- extendedWaitUntil:
    visible: "Projects"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "RLS Probe"
    timeout: 20000

# === Section E: Mike cleans up ================================================
- runFlow: ../subflows/signup-or-login-mike.yaml
- extendedWaitUntil:
    visible: "RLS Probe"
    timeout: 30000
- tapOn: "RLS Probe"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
- extendedWaitUntil:
    notVisible: "RLS Probe"
    timeout: 10000
