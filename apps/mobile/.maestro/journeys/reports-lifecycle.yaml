# Journey 3: Reports lifecycle (non-media)
#
# Replaces ~10 granular report flows by walking the full report lifecycle on
# a single project. Uses Mike's seeded Highland Tower Complex project so we
# don't burn time on project creation, plus a temp project for the
# empty-reports state.
#
# Covers:
#   - Empty-state on a brand-new project (No reports yet)
#   - Resume seeded draft (tabs + note input)
#   - Open seeded final-0 (detail, actions menu — all 4 buttons present,
#     delete-cancel keeps it)
#   - Reopen final-1 from list (regression for read-back path)
#   - Create new draft -> add note -> generate (fixture LLM) ->
#     tab-switching (notes / report / edit sections) ->
#     finalize-cancel keeps draft -> finalize -> delete confirm
#
# DEFERRED to other branches (do not add here):
#   - Voice notes (parallel: feat/voice-note-summary)
#   - Photos / file uploads (parallel: feat/media-pipeline)
#   - PDF view / save / share (depends on file pipeline)
#   - Note add/remove / timeline order / soft-delete cascade
#
# Persona: Mike (deep-link).
appId: com.harpa.pro
tags:
  - journey
  - reports
---

# === Section A: Login + open Highland Tower (seed project) =====================
- runFlow: ../subflows/signup-or-login-mike.yaml
- extendedWaitUntil:
    visible:
      id: "project-row-0"
    timeout: 30000
- tapOn: ".*Highland Tower Complex.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Total reports"
    timeout: 30000

# === Section B: Open reports list ==============================================
- tapOn:
    id: "btn-open-reports"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "report-row-draft-0"
    timeout: 20000
- assertVisible:
    id: "btn-new-report"
- assertVisible:
    id: "report-row-final-0"

# === Section C: Resume seeded draft ============================================
- tapOn:
    id: "report-row-draft-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "New Report"
    timeout: 15000
- assertVisible:
    id: "btn-tab-notes"
- assertVisible:
    id: "btn-tab-report"
- assertVisible:
    id: "input-note"
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

# === Section D: Open seeded final-0, exercise actions menu, delete-cancel ======
- extendedWaitUntil:
    visible:
      id: "report-row-final-0"
    timeout: 20000
- tapOn:
    id: "report-row-final-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-report-actions"
    timeout: 15000
- assertVisible: "Summary"

# D1. Actions menu shows all 4 buttons
- tapOn:
    id: "btn-report-actions"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-report-view-pdf"
    timeout: 10000
- assertVisible:
    id: "btn-report-save-pdf"
- assertVisible:
    id: "btn-report-share-pdf"
- assertVisible:
    id: "btn-report-delete"

# D2. Delete -> Cancel keeps the report
- tapOn:
    id: "btn-report-delete"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "dialog-sheet"
    timeout: 5000
- tapOn:
    id: "dialog-action-1"
- waitForAnimationToEnd
- assertVisible:
    id: "btn-report-actions"

# Back to list
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

# === Section E: Reopen final-1 from list (read-back regression) ================
- extendedWaitUntil:
    visible:
      id: "report-row-final-1"
    timeout: 15000
- tapOn:
    id: "report-row-final-1"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-report-actions"
    timeout: 15000
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

# === Section F: New draft -> generate -> tab-switching -> finalize-cancel ->
#                finalize -> delete (confirm) =================================
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 15000
- tapOn:
    id: "btn-new-report"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "New Report"
    timeout: 15000

# F1. Add a rich note that exercises weather/workers/materials/issues sections
- tapOn:
    id: "input-note"
- inputText: "Site visit on 26 April. Sunny, light breeze, around 24 degrees. Eight carpenters and two electricians on site, roughly 80 hours total. Delivered 2 tonnes of N12 reinforcement bar in good condition. Issue: scaffolding on the north face is missing toe-boards, medium severity, action required before next pour."
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

# F2. Bounce to notes tab so Generate CTA renders, then trigger generation
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-generate-update-report"
    timeout: 10000
- tapOn:
    id: "btn-generate-update-report"
- waitForAnimationToEnd

# Surface report-generation failures explicitly (mirrors cloud/journey.yaml)
- assertNotVisible: "Unexpected response format.*"
- assertNotVisible: "Edge function.*"
- extendedWaitUntil:
    visible:
      text: "sunny"
    timeout: 60000

# F3. Tab switching: notes -> report -> edit sections
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- assertVisible: ".*Site visit on 26 April.*"
- tapOn:
    id: "btn-tab-report"
- waitForAnimationToEnd
- tapOn:
    id: "btn-tab-edit"
- waitForAnimationToEnd
- assertVisible:
    id: "edit-autosave-status"
- assertVisible:
    id: "edit-section-meta"
- scrollUntilVisible:
    element:
      id: "edit-section-weather"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 30
- scrollUntilVisible:
    element:
      id: "edit-section-workers"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 30
- scrollUntilVisible:
    element:
      id: "edit-section-materials"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 30
- scrollUntilVisible:
    element:
      id: "edit-section-issues"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 30
- scrollUntilVisible:
    element:
      id: "edit-section-next-steps"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 30
- scrollUntilVisible:
    element:
      id: "edit-section-sections"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 30

# F4. Back to Report tab and open the finalize-confirm dialog
- tapOn:
    id: "btn-tab-report"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Finalize Report"
    direction: DOWN
    speed: 80
    timeout: 15000
    visibilityPercentage: 30
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Finalize Report"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "dialog-action-1"
    timeout: 15000

# F5. Cancel keeps the report in draft
- tapOn:
    id: "dialog-action-1"
- waitForAnimationToEnd
- assertNotVisible:
    id: "dialog-action-1"
- assertVisible: "Finalize Report"

# F6. Finalize for real
- runFlow: ../subflows/finalize-report.yaml

# F7. Delete (confirm) the freshly-finalized report so we don't pollute seed
- tapOn:
    id: "btn-report-actions"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-report-delete"
    timeout: 10000
- tapOn:
    id: "btn-report-delete"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "dialog-sheet"
    timeout: 5000
- tapOn:
    id: "dialog-action-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 15000

# Back to project overview
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

# === Section G: Empty-reports state on a fresh project =========================
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Projects"
    timeout: 10000
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "Reports Empty Probe"
      PROJECT_ADDRESS: "1 Empty St"
      CLIENT_NAME: "Empty Co"
- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- tapOn:
    id: "btn-open-reports"
- waitForAnimationToEnd
- assertVisible: "No reports yet"
- assertVisible:
    id: "btn-new-report"

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
