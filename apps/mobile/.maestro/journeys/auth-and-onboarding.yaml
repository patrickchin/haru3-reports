# Journey 1: Auth & Onboarding
#
# Replaces 11 granular auth flows by walking the full unauthenticated surface
# in one trip. Covers:
#   - Login phone validation (too-short input)
#   - OTP wrong/short code error paths
#   - Change-number button on the verify step
#   - Signup stepper happy path (identity -> phone -> verify)
#   - Signup back navigation between stepper steps
#   - Signup identity validation (empty + 1-char name/company)
#   - Onboarding screen validation for a fresh, unseeded number
#   - Sign-out from profile
#
# Persona: fresh OTP user (+15550000004 -> onboarding) and Mike (deep-link)
# for the sign-out segment.
#
# Notes:
# - Starts with `clearState: true` via ensure-logged-out for full isolation.
# - Uses the OTP path deliberately (this is the only journey that exercises
#   it). Other journeys use the deep-link login subflow for speed.
# - Skipped on Release (skip-release) because dev-only deep-link login is
#   used in the second half. Release CI should run the OTP-only subset.
appId: com.harpa.pro
tags:
  - journey
  - auth
---

# === Section A: Login surface (negative paths) =================================
- runFlow: ../subflows/ensure-logged-out.yaml

# A1. Phone too short -> validation error
- tapOn:
    id: "input-phone"
- eraseText:
    charactersToErase: 20
- inputText: "123"
- tapOn:
    point: "50%,25%"
- tapOn: "Send Code"
- extendedWaitUntil:
    visible: ".*phone number with country code.*"
    timeout: 3000

# A2. Valid phone, but enter wrong OTP -> error, do NOT navigate
- tapOn:
    id: "input-phone"
- eraseText:
    charactersToErase: 20
- inputText: "+15551234567"
- tapOn:
    point: "50%,25%"
- tapOn: "Send Code"
- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 5000

# A3. Verify-step UI elements present (change-number affordance)
- assertVisible: "Verify Code"
- assertVisible:
    id: "use-different-number"
- assertVisible:
    id: "btn-login-change-number"

# A4. Wrong OTP code -> error banner, stay on verify
- tapOn:
    id: "input-otp"
- inputText: "000000"
- tapOn:
    point: "50%,25%"
- tapOn: "Verify Code"
- extendedWaitUntil:
    visible: ".*Unable to verify.*"
    timeout: 5000
    optional: true
- assertNotVisible: "Projects"

# A5. Change Number takes us back to phone step
- tapOn:
    id: "btn-login-change-number"
- waitForAnimationToEnd
- assertNotVisible:
    id: "input-otp"
- assertVisible: "Send Code"

# === Section B: Signup stepper =================================================

# B1. Open signup screen
- tapOn:
    id: "link-signup"
- waitForAnimationToEnd
- assertVisible: "Create Account"
- assertVisible: "About you"
- assertVisible: "Back to Sign In"

# B2. Identity validation: empty submit -> error
- tapOn:
    point: "50%,25%"
- tapOn: "Continue"
- assertVisible: ".*Please enter your full name.*"

# B3. Identity validation: 1-char name -> still error
- tapOn:
    id: "input-signup-name"
- inputText: "A"
- tapOn:
    point: "50%,25%"
- tapOn: "Continue"
- assertVisible: ".*Please enter your full name.*"

# B4. Valid name but empty company -> error
- tapOn:
    id: "input-signup-name"
- eraseText:
    charactersToErase: 20
- inputText: "Signup Test User"
- tapOn:
    point: "50%,25%"
- tapOn: "Continue"
- assertVisible: ".*Please enter your company name.*"

# B5. Fill company, advance to phone step
- tapOn:
    id: "input-signup-company"
- inputText: "Signup Test Co"
- tapOn:
    point: "50%,25%"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Phone Number"
    timeout: 5000

# B6. Back navigation: phone -> identity
- tapOn: "Back"
- waitForAnimationToEnd
- assertVisible: "About you"

# B7. Forward again: identity -> phone -> verify (happy path)
- tapOn:
    point: "50%,25%"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Phone Number"
    timeout: 5000
- tapOn:
    id: "input-signup-phone"
- inputText: "+15559999999"
- tapOn:
    point: "50%,25%"
- tapOn: "Send Code"
- extendedWaitUntil:
    visible: "Code"
    timeout: 5000
- tapOn:
    id: "input-signup-otp"
- inputText: "888888"
- tapOn:
    point: "50%,25%"
- tapOn:
    id: "btn-signup-verify"
- extendedWaitUntil:
    visible: "Projects"
    timeout: 10000

# === Section C: Onboarding validation (fresh unseeded user) ====================
# Reset and OTP-login as +15550000004, an unseeded number that lands on the
# onboarding screen instead of bypassing it (Charlie/Mike/Sarah have profiles).

- runFlow: ../subflows/ensure-logged-out.yaml
- tapOn:
    id: "input-phone"
- eraseText:
    charactersToErase: 20
- inputText: "+15550000004"
- tapOn:
    point: "50%,25%"
- tapOn: "Send Code"
- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 5000
- tapOn:
    id: "input-otp"
- inputText: "888888"
- tapOn:
    point: "50%,25%"
- tapOn: "Verify Code"
- extendedWaitUntil:
    visible:
      id: "screen-onboarding"
    timeout: 10000

# C1. Submit empty -> validation error
- tapOn:
    point: "50%,25%"
- tapOn: "Get Started"
- extendedWaitUntil:
    visible: ".*enter your full name.*"
    timeout: 5000

# === Section D: Sign-out =======================================================
# Switch to a known-good user via deep link, then sign out from profile.

- runFlow: ../subflows/signup-or-login-mike.yaml

- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "btn-sign-out"
    direction: DOWN
    speed: 80
    timeout: 10000
    visibilityPercentage: 30
- tapOn:
    id: "btn-sign-out"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Phone Number"
    timeout: 8000
