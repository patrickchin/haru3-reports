# Shared subflow: flip the dev-only `forceOffline` flag.
#
# Drives the in-app Developer-section switch (`btn-toggle-offline`) on
# `app/profile.tsx`. The Switch's onValueChange writes to
# `setDevFlag("forceOffline", ...)` (lib/dev-flags.ts) which the
# SyncProvider reads to gate online status. Calling this once flips
# the current state — call it again to flip back.
#
# Caller invariant: starts on the Projects screen (or any screen with
# `btn-open-profile` reachable from the header). Returns to the same
# screen via the profile-screen back button.
#
# Resilience: the Developer section only renders when DEV_TOOLS_VISIBLE
# is true (see lib/dev-flags.ts). On a Release build that was not built
# with the dev env vars, the section is hidden and the toggle is not
# tappable. We use `optional: true` waits + a `when: visible:` guard so
# this subflow no-ops cleanly in that case rather than erroring out;
# the calling flow's offline-banner assertions will then fail on their
# own merits (or be tagged `skip-release`).
appId: com.harpa.pro
---
- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd

# Scroll the developer section into view if it exists. `scrollUntilVisible`
# with `optional: true`-equivalent semantics doesn't exist, so we wrap the
# scroll + tap in a `when: visible:` guard against the section header.
- runFlow:
    when:
      visible:
        id: "developer-section"
    commands:
      - scrollUntilVisible:
          element:
            id: "btn-toggle-offline"
          direction: DOWN
          speed: 40
          timeout: 4000
      - tapOn:
          id: "btn-toggle-offline"
      - waitForAnimationToEnd

# Try to scroll-find the toggle even if `developer-section` testID is
# missing on older binaries (defensive — current binary has the testID
# but earlier preview builds did not).
- runFlow:
    when:
      visible:
        id: "btn-toggle-offline"
    commands:
      - tapOn:
          id: "btn-toggle-offline"
      - waitForAnimationToEnd

- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
