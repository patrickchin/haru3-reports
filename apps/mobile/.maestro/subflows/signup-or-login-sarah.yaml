# Shared subflow: sign in as Sarah Chen via the e2e deep-link route.
# See signup-or-login-mike.yaml for context.
appId: com.harpa.pro
---
- runFlow: ensure-logged-out.yaml

- openLink: "harpa://e2e/login?demo=1"

# iOS 17+ shows a system "Open in Harpa Pro?" confirm sheet.
- extendedWaitUntil:
    visible: "Open"
    timeout: 3000
    optional: true
- tapOn:
    text: "Open"
    optional: true

- extendedWaitUntil:
    visible: "Projects"
    timeout: 15000
