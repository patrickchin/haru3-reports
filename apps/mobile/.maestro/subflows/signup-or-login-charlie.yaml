# Shared subflow: sign in as Charlie Empty via the e2e deep-link route.
# Charlie is used for empty-state flows (no projects, no reports).
# See signup-or-login-mike.yaml for context.
appId: com.harpa.pro
---
- runFlow: ensure-logged-out.yaml

- openLink: "harpa://e2e/login?demo=2"

- extendedWaitUntil:
    visible: "Projects"
    timeout: 8000
