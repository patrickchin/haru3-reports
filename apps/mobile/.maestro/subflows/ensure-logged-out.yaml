# Shared subflow: ensure a clean, logged-out app state.
#
# `clearState: true` runs `pm clear com.harpa.pro` under the hood, which
# wipes the app's data partition (including the AsyncStorage file that
# holds the Supabase session). After this runs the app cannot have a
# persisted session — there's nowhere left to read one from.
#
# History: this subflow used to do three sequential clearState launches,
# a killApp, several dev-launcher tap branches, and a
# scrollUntilVisible/sign-out recovery branch. None of that was needed
# in steady state — it was workarounds for an unrelated app crash that
# made the home screen visible mid-flow. See
# docs/maestro/login-troubleshooting.md.
appId: com.harpa.pro
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Debug builds only: bypass the expo-dev-client launcher with a direct
# bundle URL. No-op on Release because the launcher screen never appears.
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - openLink: "harpa://expo-development-client/?url=http://10.0.2.2:8081"
      - waitForAnimationToEnd

# Fail fast if the app didn't actually launch. If this assertion fails,
# the app crashed before reaching the login screen — check logcat for
# the host package, do not "recover" by relaunching.
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 15000
