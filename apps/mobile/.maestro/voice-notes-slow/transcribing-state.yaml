# Voice Notes: Immediate "Transcribing…" state appears between record-stop
# and transcript arrival.
#
# Prerequisites:
#   1. Build with EXPO_PUBLIC_E2E_MOCK_VOICE_NOTE=true (see
#      docs/09-testing.md § Voice-note flows). Without the mock,
#      simulator audio recording produces no usable bytes for
#      transcription.
#   2. The transcribe-audio edge function MUST be running with
#      `FIXTURES_DELAY_MS >= 2000`. The `Transcribing…` placeholder
#      is by definition transient — it lives only between record-stop
#      and the transcript arriving. Maestro's `assertVisible` polls on
#      the order of ~500ms, so with the default fast-iteration value
#      of `FIXTURES_DELAY_MS=0` the placeholder is replaced by the
#      transcript before the next poll and this flow false-fails.
#
#      Set the value in `supabase/.env.fixtures` and restart
#      `supabase functions serve` before running this flow:
#
#        sed -i.bak -E 's|^FIXTURES_DELAY_MS=.*|FIXTURES_DELAY_MS=3000|' \
#          supabase/.env.fixtures
#        pkill -f 'supabase functions serve' ; \
#          supabase functions serve --env-file supabase/.env.fixtures \
#            --no-verify-jwt &
#        cd apps/mobile && \
#          maestro test .maestro/voice-notes-slow/transcribing-state.yaml
#
#      Restore `FIXTURES_DELAY_MS=0` afterwards for the rest of the
#      local dev loop.
#
# This flow lives in `voice-notes-slow/` (not `voice-notes/`) on
# purpose so a plain `maestro test .maestro/voice-notes/` does not
# pick it up. The `skip-release` tag is also kept for any tag-aware
# CI runner.
#
# Covers commits:
#   - 2db1849 add immediate transcribing state + server-side fixture mocks
#   - 6d30584 show voice notes while transcribing
#   - d4cb804 persist row even when screen unmounts mid-transcription
appId: com.harpa.pro
tags:
  - voice-notes
  - positive
  - skip-release
env:
  PROJECT_NAME: "VN Transcribing"
  PROJECT_ADDRESS: "11 Transcribe Ln"
  CLIENT_NAME: "Mike Transcribe"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Record a voice note via the actual composer controls.
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"

# Switch to Notes tab so the timeline-side transcribing row is visible.
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd

# The unified timeline must already show a row for this voice note,
# even though no transcript has come back yet (commit 6d30584).
- assertVisible:
    id: "note-timeline"

# Immediate transcribing state — VoiceNoteCard renders italic "Transcribing…"
# while isTranscribing is true. There is no dedicated testID for this row
# yet; we assert via text. See "Missing testIDs" in the PR description.
- assertVisible: "Transcribing…"

# Voice-note card itself is rendered (regex match — file id is a runtime UUID).
- assertVisible:
    id: "voice-note-card-.*"

# Wait until the transcript actually replaces the transcribing state.
- extendedWaitUntil:
    visible:
      id: "voice-note-transcript-.*"
    timeout: 60000

# Once the transcript is in, the "Transcribing…" placeholder must be gone.
- assertNotVisible: "Transcribing…"

# Clean up
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
