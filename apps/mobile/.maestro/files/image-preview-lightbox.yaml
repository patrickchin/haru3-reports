# Files: Image preview lightbox open → close
#
# End-to-end coverage of ImagePreviewModal: open the attachment sheet,
# pick the checked-in fixture (`test-image.jpg`) via the system Photo
# Library picker, wait for the upload to complete, tap the resulting
# FileCard to open the lightbox, then close it.
#
# Selectors:
#   - btn-attachment              opens AppDialogSheet
#   - dialog-action-1             "Pick a photo from library" entry
#   - btn-open-file-<id>          completed FileCard (regex match)
#   - image-preview               <Image> inside the modal
#   - btn-close-image-preview     close button
appId: com.harpa.pro
tags:
  - files
  - upload-queue
  - positive
env:
  PROJECT_NAME: "Img Preview"
  PROJECT_ADDRESS: "412 File St"
  CLIENT_NAME: "Img Client"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Open attachment sheet → Photo Library.
- tapOn:
    id: "btn-attachment"
- extendedWaitUntil:
    visible:
      id: "dialog-sheet"
    timeout: 3000
- tapOn:
    id: "dialog-action-1"
- waitForAnimationToEnd

# Permission prompts (first run only).
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "OK"
    optional: true

# Seed the picker with the checked-in fixture and confirm selection.
- addMedia:
    - test-image.jpg
- tapOn:
    point: "50%,55%"
- tapOn:
    text: "Add"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd

# Switch to Notes tab where uploaded files appear in the timeline.
- tapOn:
    id: "btn-tab-notes"
    optional: true
- waitForAnimationToEnd

# Wait for the upload to complete and the FileCard to surface.
- extendedWaitUntil:
    visible:
      id: "btn-open-file-.*"
    timeout: 30000

# Tap the FileCard to open the image preview modal.
- tapOn:
    id: "btn-open-file-.*"
- waitForAnimationToEnd

# Lightbox: placeholder/loading may flash briefly, then the full image.
# The full image must appear (not optional) — that's the contract.
- extendedWaitUntil:
    visible:
      id: "image-preview"
    timeout: 10000

# Close the lightbox.
- tapOn:
    id: "btn-close-image-preview"
- waitForAnimationToEnd
- assertNotVisible:
    id: "image-preview"

- runFlow: ../subflows/assert-no-error.yaml

# Cleanup
- tapOn:
    id: "btn-back"
    optional: true
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
