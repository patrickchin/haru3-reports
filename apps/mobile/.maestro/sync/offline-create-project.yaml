# Sync: create a project while offline, then come back online and
# verify the optimistic row survived the push/pull cycle.
#
# Exercises the local-first write path:
#   1. forceOffline ON → SyncProvider.isOnline=false, push gates close.
#   2. Project creation writes to local SQLite + invalidates the
#      projects query, so the row appears immediately under the
#      offline banner.
#   3. forceOffline OFF → provider runs an immediate push, the offline
#      banner auto-hides once the queue drains.
#   4. The row must still be present after sync (no optimistic rollback
#      and no error toast).
appId: com.harpa.pro
tags:
  - sync
  - positive
  - skip-release
env:
  PROJECT_NAME: "Offline First"
  PROJECT_ADDRESS: "300 Sync Ln"
  CLIENT_NAME: "Offline Client"
---
- runFlow: ../subflows/signup-or-login-mike.yaml

# Sanity: we start online with the banner hidden.
- assertNotVisible:
    id: "connection-banner-offline"

# Go offline and confirm the banner is up before we mutate anything.
- runFlow: ../subflows/toggle-offline.yaml
- extendedWaitUntil:
    visible:
      id: "connection-banner-offline"
    timeout: 5000

# Create a project while offline. The row should appear optimistically
# in the list (local-first write) even though the network is "down".
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- assertVisible: "${PROJECT_NAME}"
- assertVisible:
    id: "connection-banner-offline"
- runFlow: ../subflows/assert-no-error.yaml

# Come back online — SyncProvider runs an immediate push/pull/generation
# cycle, so the offline banner should disappear once the queue drains.
- runFlow: ../subflows/toggle-offline.yaml

- extendedWaitUntil:
    notVisible:
      id: "connection-banner-offline"
    timeout: 15000

# Row survived the round-trip.
- assertVisible: "${PROJECT_NAME}"
- assertVisible:
    id: "project-row-0"
- runFlow: ../subflows/assert-no-error.yaml

# Clean up.
- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
