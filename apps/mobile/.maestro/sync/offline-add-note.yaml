# Sync: add a text note to a draft report while offline.
#
# Verifies that the report-notes write path is local-first: the new
# note shows up in the timeline immediately while the offline banner
# is up, and survives the queue drain when we come back online.
#
# Setup is online (project + draft create) so we isolate the offline
# behaviour to the note-add step. The draft itself is a local-first
# row in v7 of the local DB (see lib/local-db/migrations.ts), so this
# also implicitly exercises the same path that v7's unique-position
# index protects.
appId: com.harpa.pro
tags:
  - sync
  - positive
env:
  PROJECT_NAME: "Offline Note"
  PROJECT_ADDRESS: "301 Sync Ln"
  CLIENT_NAME: "Offline Note Client"
  NOTE_TEXT: "Cracked rendering on south wall (offline)"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Go offline before adding the note.
- runFlow: ../subflows/toggle-offline.yaml
- extendedWaitUntil:
    visible:
      id: "connection-banner-offline"
    timeout: 5000

# Add a note while offline. The composer writes to local SQLite via
# useLocalReportNotes, so the timeline should pick it up optimistically.
- tapOn:
    id: "input-note"
- inputText: "${NOTE_TEXT}"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

# Dismiss keyboard so the timeline is fully visible.
- tapOn:
    point: "50%,25%"

- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd

- assertVisible:
    id: "note-timeline"
- assertVisible: "${NOTE_TEXT}"
- assertVisible:
    id: "connection-banner-offline"
- runFlow: ../subflows/assert-no-error.yaml

# Come back online; the queued note pushes and the banner clears.
- runFlow: ../subflows/toggle-offline.yaml
- extendedWaitUntil:
    notVisible:
      id: "connection-banner-offline"
    timeout: 15000

# Note still present after sync.
- assertVisible: "${NOTE_TEXT}"
- runFlow: ../subflows/assert-no-error.yaml

# Clean up.
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
