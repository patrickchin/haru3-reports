# Sync: ConnectionBanner reflects forceOffline toggle.
#
# Smoke test for the in-app dev toggle that drives the SyncProvider's
# isOnline flag. Verifies:
#   1. Banner is hidden when truly online (no offline testID rendered).
#   2. Toggling forceOffline ON makes `connection-banner-offline`
#      appear within the slide-in animation window.
#   3. Toggling forceOffline OFF flips the banner to its "online"
#      reconnected state briefly, then auto-hides after the
#      BACK_ONLINE_DISPLAY_MS timer (see ConnectionBanner.tsx).
appId: com.harpa.pro
tags:
  - sync
  - positive
  - smoke
---
- runFlow: ../subflows/signup-or-login-mike.yaml

# Online to start: the offline banner content must not be rendered.
- assertNotVisible:
    id: "connection-banner-offline"
- assertVisible: "Projects"

# Toggle offline ON.
- runFlow: ../subflows/toggle-offline.yaml

- extendedWaitUntil:
    visible:
      id: "connection-banner-offline"
    timeout: 5000

# Toggle offline OFF — banner crossfades to the online state and then
# auto-hides ~2.5s later.
- runFlow: ../subflows/toggle-offline.yaml

# The reconnected banner is briefly visible. We don't hard-assert it
# because the BACK_ONLINE_DISPLAY_MS timer can race a slow simulator.
- assertVisible:
    id: "connection-banner-online"
    optional: true

# Banner must be gone within the auto-hide window. Padding the timeout
# generously so a slow CI sim doesn't flake here.
- extendedWaitUntil:
    notVisible:
      id: "connection-banner-offline"
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      id: "connection-banner-online"
    timeout: 8000

- runFlow: ../subflows/assert-no-error.yaml
