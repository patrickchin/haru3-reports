# Reports: Deleting a voice-note file cascades the linked report_notes row
#
# Regression for commits 6d23eb04 / f24ac24 / e5190a2 — when a
# voice-note `file_metadata` row is soft-deleted, the corresponding
# `report_notes` row (kind='voice', file_id=<file>) must also be
# soft-deleted by the `soft_delete_report_notes_for_file` RPC. Without
# the cascade, the timeline kept rendering an orphan voice-note row
# (transcript text but no playable audio).
appId: com.harpa.pro
tags:
  - reports
  - positive
env:
  PROJECT_NAME: "VN Cascade"
  PROJECT_ADDRESS: "230 Rpt St"
  CLIENT_NAME: "Rpt Cascade"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Record a voice note via the actual composer controls. The mocked
# E2E recorder writes a placeholder audio file; the transcribe-audio
# edge function (USE_FIXTURES=true) returns the canned transcript.
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"
- waitForAnimationToEnd

# Switch to Notes tab and wait for the voice card + transcript to land.
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "voice-note-transcript-.*"
    timeout: 60000

# Pre-delete: the voice card and its linked report_notes row are both
# rendered (the unified timeline merges files + report_notes by time).
- assertVisible:
    id: "note-timeline"
- assertVisible:
    id: "voice-note-card-.*"
- assertVisible:
    id: "voice-note-transcript-.*"

# Delete the voice note. Opens AppDialogSheet; dialog-action-0 is the
# destructive confirm (same pattern as reports/delete-confirm.yaml).
- tapOn:
    id: "btn-voice-note-delete-.*"
- extendedWaitUntil:
    visible:
      id: "dialog-sheet"
    timeout: 5000
- tapOn:
    id: "dialog-action-0"
- waitForAnimationToEnd

# Post-delete: the voice card is gone (file row soft-deleted) AND the
# transcript text is gone too — proving the cascade ran. Without the
# cascade, "Mocked voice note for E2E" would still be visible as an
# orphan report_notes row even though the audio was deleted.
- assertNotVisible:
    id: "voice-note-card-.*"
- assertNotVisible:
    id: "voice-note-transcript-.*"

# Timeline should now be empty (no other items were added).
- assertNotVisible:
    id: "note-timeline"

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
