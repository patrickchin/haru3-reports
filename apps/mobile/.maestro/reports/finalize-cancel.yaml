# Reports: Cancel the finalize-confirm dialog keeps the report in draft
# Regression for the confirm-before-finalize dialog: tapping "Cancel" must
# dismiss the sheet and leave the report editable (Finalize button still
# present, no navigation to the finalized detail).
appId: com.harpa.pro
tags:
  - reports
  - positive
env:
  PROJECT_NAME: "Finalize Cancel"
  PROJECT_ADDRESS: "208 Rpt St"
  CLIENT_NAME: "Rpt Cancel"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Add note and generate so the Finalize button is enabled
- tapOn:
    id: "input-note"
- inputText: "Finalize cancel test"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd
# Manually trigger report generation (also switches to Report tab).
# btn-add-note auto-switches to Report tab; bounce back to Notes tab
# so the Generate/Update CTA is rendered before tapping it.
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-generate-update-report"
    timeout: 5000
- tapOn:
    id: "btn-generate-update-report"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "sunny"
    timeout: 15000

# Open the finalize-confirm dialog. Match the Finalize CTA by label text
# (testID doesn't always propagate to iOS accessibility tree on Release
# builds for Button-wrapped Pressables) with a relaxed visibility threshold,
# same as subflows/finalize-report.yaml.
- scrollUntilVisible:
    element:
      text: "Finalize Report"
    direction: DOWN
    speed: 80
    timeout: 15000
    visibilityPercentage: 30
- tapOn:
    text: "Finalize Report"
- extendedWaitUntil:
    visible:
      id: "dialog-action-1"
    timeout: 5000

# dialog-action-1 is the Cancel button (second action in the dialog)
- tapOn:
    id: "dialog-action-1"
- waitForAnimationToEnd

# Dialog should be gone and we should still be on the generate screen with
# the Finalize button visible — the report is still a draft. Match the
# Finalize CTA by label text (testID doesn't always reach the accessibility
# tree on Release builds for Button-wrapped Pressables).
- assertNotVisible:
    id: "dialog-action-1"
- assertVisible: "Finalize Report"
# Generate screen still shows the report tab content (no nav happened).
- assertVisible:
    id: "btn-tab-report"

# Clean up
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
