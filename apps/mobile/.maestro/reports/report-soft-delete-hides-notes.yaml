# Reports: Soft-deleting a draft removes it from the report list
#
# Verifies that `soft_delete_report` (lib/draft-report-actions.ts) takes
# the draft out of the SELECT projection (`deleted_at IS NULL`) so it
# no longer appears in the project's reports list. The draft contained
# a typed note + a voice note; both are tied to the report and become
# inaccessible alongside it.
#
# NOTE on file cascade: voice-note `file_metadata` rows are scoped to
# the project, not the report. Deleting the parent report soft-deletes
# its `report_notes` rows but leaves the upload itself addressable in
# the project's files area (intentional — see lib/file-upload.ts).
# We therefore do NOT assert the voice file disappears from the
# project; that would over-specify the cascade. The orphan-file path
# is covered by voice-note-soft-delete-cascade.yaml at the file layer.
appId: com.harpa.pro
tags:
  - reports
  - positive
env:
  PROJECT_NAME: "Rpt SoftDel"
  PROJECT_ADDRESS: "231 Rpt St"
  CLIENT_NAME: "Rpt SoftDel Co"
---
- runFlow: ../subflows/signup-or-login-mike.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Populate the draft with both kinds of notes so the soft-delete has
# real content to take with it.
- tapOn:
    id: "input-note"
- inputText: "Typed note before delete"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"
- waitForAnimationToEnd

# Confirm both items are present in the unified timeline pre-delete.
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Mocked voice note for E2E"
    timeout: 15000
- assertVisible:
    id: "note-timeline"
- assertVisible: "Typed note before delete"
- assertVisible: "Voice note"

# Back to the reports list and soft-delete the draft via the swipe
# action. Same dialog pattern as reports/delete-confirm.yaml.
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "report-row-draft-0"
    timeout: 5000

- tapOn:
    id: "btn-delete-report-0"
    optional: true
- extendedWaitUntil:
    visible: "Delete"
    timeout: 3000
    optional: true
- tapOn:
    text: "Delete"
    optional: true
- waitForAnimationToEnd

# The draft should be gone from the list — `report-row-draft-0` is the
# index-based testID, so any remaining row would re-take that id.
- assertNotVisible:
    id: "report-row-draft-0"
# And the empty-list affordance is back.
- assertVisible:
    id: "btn-new-report"

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
