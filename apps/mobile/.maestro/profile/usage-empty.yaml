# Profile: Usage section — empty state (fresh user)
appId: com.harpa.pro
tags:
  - profile
  - empty-state
  - skip-release
---
- runFlow: ../subflows/signup-or-login-charlie.yaml

- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd

# usage-empty-state appears inline on the profile card before navigating
- assertVisible:
    id: "usage-empty-state"

# Open the full Usage screen
- tapOn:
    id: "btn-open-usage"
- waitForAnimationToEnd
- assertVisible:
    id: "screen-usage"
- assertVisible:
    id: "screen-header-title"

# Fresh user should show zero or empty usage
- assertVisible:
    text: "0"
    optional: true
