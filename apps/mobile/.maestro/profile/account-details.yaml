# Profile: Account details screen
appId: com.harpa.pro
tags:
  - profile
  - positive
  - skip-release
---
- runFlow: ../subflows/signup-or-login-mike.yaml

- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd

- tapOn:
    text: "Account Details"
    optional: true
- waitForAnimationToEnd

- assertVisible:
    id: "screen-account"

# Verify all canonical profile fields render
- assertVisible:
    id: "profile-display-name"
- assertVisible:
    id: "profile-phone"
- assertVisible:
    id: "profile-company-name"
    optional: true
- assertVisible:
    id: "build-info"
- assertVisible:
    id: "server-info"

# Verify account info
- assertVisible:
    text: "Mike Torres"
    optional: true
- assertVisible:
    text: "+15551234567"
    optional: true

# Go back
- tapOn:
    id: "btn-back"
    optional: true
