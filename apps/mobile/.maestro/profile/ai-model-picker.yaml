# Profile: AI model picker (Developer section)
appId: com.harpa.pro
tags:
  - profile
  - positive
---
- runFlow: ../subflows/signup-or-login-mike.yaml

- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd

# Scroll down to Developer section (only visible when EXPO_PUBLIC_ENABLE_DEV_PHONE_AUTH=true)
- scrollUntilVisible:
    element:
      id: "developer-section"
    direction: DOWN
    timeout: 3000

- assertVisible:
    id: "developer-section"
- assertVisible:
    id: "ai-model-id"

# Open AI model picker
- tapOn:
    id: "btn-open-ai-model"
- waitForAnimationToEnd

# Picker sheet renders model options
- assertVisible:
    text: ".*GPT.*|.*Claude.*|.*Kimi.*"

# Pick first option then dismiss
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd

# Verify the chosen id is reflected back on profile
- assertVisible:
    id: "ai-model-id"
