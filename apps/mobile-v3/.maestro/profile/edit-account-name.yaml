# Profile: Navigate to Account Details, change the full name, save, and verify.
appId: com.harpa.pro.v3
tags:
  - profile
  - positive
---
- runFlow: ../subflows/login-mike-otp.yaml

# Open profile from Projects.
- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd

# Navigate to Account Details.
- tapOn:
    text: "Account Details"
- waitForAnimationToEnd
- assertVisible:
    id: "screen-account"

# Clear the Full Name field and type a new value.
- tapOn:
    text: "Full Name"
- clearInput
- inputText: "Mike Updated"

# Tap Save Changes.
- tapOn:
    text: "Save Changes"
- waitForAnimationToEnd

# Navigate back to profile and verify the updated name appears.
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- assertVisible:
    id: "profile-display-name"
