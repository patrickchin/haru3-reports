# Journey: Report Lifecycle (v3)
#
# The single most important E2E flow. Exercises the entire product
# end-to-end in the order a real user would — from login through
# report creation, editing, finalization, and reopening.
#
# Covers (in order):
#   1.  Auth: OTP login as Mike
#   2.  Project: create new project
#   3.  Navigate to reports
#   4.  Start new report (draft)
#   5.  Add text note
#   6.  Add voice note (mocked)
#   7.  Play voice note
#   8.  Add photo (camera capture)
#   9.  View notes summary (text + voice + photo coexist)
#   10. Generate report (fixture LLM)
#   11. View report sections
#   12. Add report note (Notes tab)
#   13. Edit report fields (Edit tab)
#   14. Finalize report
#   15. Export PDF (stub)
#   16. Share/save
#   17. Return to list — verify finalized badge
#   18. Reopen finalized report
#   19. Logout
#
# Requirements:
#   - Camera permission pre-granted to com.harpa.pro
#   - Build flag EXPO_PUBLIC_E2E_MOCK_VOICE_NOTE=true
#   - Backend USE_FIXTURES=true
appId: com.harpa.pro
tags:
  - journey
  - core
  - fixture-mode
env:
  PROJECT_NAME: "Lifecycle Probe"
  PROJECT_ADDRESS: "1 Lifecycle Way, Portland"
  CLIENT_NAME: "Lifecycle Client"
---

# === Step 1: Login as Mike ====================================================
- runFlow: ../subflows/login-mike-otp.yaml
- extendedWaitUntil:
    visible: "Projects"
    timeout: 15000

# === Step 2: Create project ===================================================
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${PROJECT_NAME}"
    timeout: 10000
- assertVisible: "Total reports"

# === Step 3: Navigate to reports ==============================================
- tapOn:
    id: "btn-open-reports"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 5000

# === Step 4: Start new report =================================================
- tapOn:
    id: "btn-new-report"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "New Report"
    timeout: 3000

# === Step 5: Add text note ====================================================
- tapOn:
    id: "input-note"
- inputText: "Foundation poured at south wall, weather sunny, crew of 6, materials delivered on time"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "btn-add-note"
    timeout: 5000
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Notes \\(1\\).*"
    timeout: 10000

# Switch back to Notes tab
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Foundation poured at south wall.*"
    timeout: 5000

# === Step 6: Add voice note (mocked) =========================================
- tapOn:
    id: "btn-record-start"
- tapOn:
    id: "btn-record-voice"
    optional: true
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "btn-stop-recording"
    timeout: 5000
    optional: true

- tapOn:
    id: "btn-record-stop"
- tapOn:
    id: "btn-stop-recording"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "voice-note-card-.*"
    timeout: 30000

# === Step 7: Play voice note ==================================================
- tapOn:
    id: "btn-voice-note-play-.*"
- waitForAnimationToEnd

# === Step 8: Add photo (camera capture) =======================================
- tapOn:
    id: "btn-camera-capture"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-camera-shutter"
    timeout: 5000
- tapOn:
    id: "btn-camera-shutter"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "1 photo"
    timeout: 3000
- tapOn:
    id: "btn-camera-done"
- waitForAnimationToEnd

- tapOn:
    id: "btn-tab-notes"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: { id: "(pending-photo-.*|btn-open-file-.*)" }
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "btn-open-file-.*"
    timeout: 30000

# === Step 9: View notes summary ===============================================
- assertVisible: ".*Foundation poured at south wall.*"
- assertVisible:
    id: "voice-note-card-.*"
- assertVisible:
    id: "btn-open-file-.*"

# === Step 10: Generate report =================================================
- tapOn:
    id: "btn-generate-update-report"
- waitForAnimationToEnd
- assertNotVisible: ".*Unexpected response format.*"
- assertNotVisible: ".*Edge function.*"

- extendedWaitUntil:
    visible: "sunny"
    timeout: 60000

# === Step 11: View report sections ============================================
- tapOn:
    id: "btn-tab-report"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Finalize Report"
    direction: DOWN
    speed: 80
    timeout: 15000
    visibilityPercentage: 30

# === Step 12: Add report note (Notes tab) =====================================
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- tapOn:
    id: "input-note"
- inputText: "Additional note: roof inspection scheduled for tomorrow"
- hideKeyboard
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*roof inspection.*"
    timeout: 10000

# === Step 13: Edit report fields (Edit tab) ===================================
- tapOn:
    id: "btn-tab-edit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "edit-section-meta"
    timeout: 5000

# === Step 14: Finalize report =================================================
- runFlow: ../subflows/finalize-report.yaml

# After finalize, we're back on reports list
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000

# === Step 15: Export PDF (stub) ===============================================
# Open finalized report
- tapOn:
    id: "report-row-finalized-0"
- waitForAnimationToEnd

# Open report actions menu
- tapOn:
    point: "95%,6%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Report actions"
    timeout: 3000

# PDF export stub — tap if available, otherwise skip
- tapOn:
    text: "Export PDF"
    optional: true
- waitForAnimationToEnd

# === Step 16: Share/save ======================================================
# Re-open menu if PDF closed it
- tapOn:
    point: "95%,6%"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Share"
    optional: true
- waitForAnimationToEnd
# Dismiss share sheet if it appeared
- tapOn:
    text: "Cancel"
    optional: true
- waitForAnimationToEnd

# === Step 17: Return to list — verify finalized badge =========================
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- assertVisible:
    id: "report-row-finalized-0"

# === Step 18: Reopen finalized report =========================================
- tapOn:
    id: "report-row-finalized-0"
- waitForAnimationToEnd
- assertVisible:
    id: "btn-tab-report"
- assertVisible:
    id: "btn-tab-edit"
- assertVisible:
    id: "btn-tab-notes"

# Back out
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

# === Step 19: Logout ==========================================================
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

# Delete project first
- runFlow: ../subflows/delete-current-project.yaml
- assertVisible: "Projects"

# Sign out
- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "btn-sign-out"
    direction: DOWN
    speed: 80
    timeout: 10000
    visibilityPercentage: 30
- tapOn:
    id: "btn-sign-out"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "dialog-sheet"
    timeout: 5000
- tapOn:
    id: "dialog-action-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 8000

- runFlow: ../subflows/assert-no-error.yaml
