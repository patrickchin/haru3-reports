# Maestro config for harpa-pro mobile-v3.
# Defines flow directories and tags to exclude from release runs.
appId: com.harpa.pro.v3
flows:
  - "journeys/*"
  - "auth/*"
  - "projects/*"
  - "members/*"
  - "files/*"
  - "voice-notes/*"
  - "reports/*"
  - "profile/*"
  - "camera/*"
excludeTags:
  - skip-release
  - android-only
