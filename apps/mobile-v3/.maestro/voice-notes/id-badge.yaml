# Voice Notes: ID badge and metadata rendered on VoiceNoteCard
#
# Verifies that voice-note-captured-at-* and voice-note-title-* testIDs
# are visible after recording and transcription completes.
#
# Prerequisite: build with EXPO_PUBLIC_E2E_MOCK_VOICE_NOTE=true.
appId: com.harpa.pro
tags:
  - voice-notes
  - positive
  - fixture-mode
env:
  PROJECT_NAME: "VN Badge"
  PROJECT_ADDRESS: "16 Badge Blvd"
  CLIENT_NAME: "Mike Badge"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Record a voice note
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"

# Notes tab, wait for transcript
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "voice-note-summary-.*"
    timeout: 60000

# Card is visible
- assertVisible:
    id: "voice-note-card-.*"

# Metadata badges are rendered
- assertVisible:
    id: "voice-note-captured-at-.*"
- assertVisible:
    id: "voice-note-title-.*"

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
