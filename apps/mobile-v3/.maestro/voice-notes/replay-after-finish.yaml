# Voice Notes: A voice note can be replayed after playback finishes
#
# Regression test — tapping play a second time after the audio finishes
# should restart playback from the beginning.
#
# Prerequisite: build with EXPO_PUBLIC_E2E_MOCK_VOICE_NOTE=true.
appId: com.harpa.pro.v3
tags:
  - voice-notes
  - positive
  - fixture-mode
env:
  PROJECT_NAME: "VN Replay"
  PROJECT_ADDRESS: "12 Replay Rd"
  CLIENT_NAME: "Mike Replay"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Record a voice note
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "btn-record-stop"
    timeout: 3000
- tapOn:
    id: "btn-record-stop"

# Switch to Notes tab and wait for transcript
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "voice-note-transcript-.*"
    timeout: 60000

# First playback
- tapOn:
    id: "btn-voice-note-play-.*"

# Wait for the short mocked audio to finish (~3s placeholder)
- extendedWaitUntil:
    visible:
      id: "voice-note-transcript-.*"
    timeout: 5000

# Second tap — should restart playback (regression check)
- tapOn:
    id: "btn-voice-note-play-.*"

# No error after replay
- assertNotVisible: "Could not play"
- assertNotVisible: "Could not load"

# Card and transcript still rendered
- assertVisible:
    id: "voice-note-card-.*"
- assertVisible:
    id: "voice-note-transcript-.*"

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
