# Reports: Finalize report and tap View PDF action (stub).
#
# Similar to report-pdf-save but exercises the "View PDF" path in the
# actions menu. If the action is not yet implemented, flow succeeds
# with a stub assertion.
appId: com.harpa.pro
tags:
  - reports
  - fixture-mode
env:
  PROJECT_NAME: "PDF View Test"
  PROJECT_ADDRESS: "901 PDF View Rd"
  CLIENT_NAME: "PDF View Client"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Add note and generate
- tapOn:
    id: "input-note"
- inputText: "insulation installed in exterior walls, vapor barrier applied"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-generate-update-report"
    timeout: 5000
- tapOn:
    id: "btn-generate-update-report"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "insulation"
    timeout: 60000

# Finalize
- runFlow: ../subflows/finalize-report.yaml

# Open finalized report
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- tapOn:
    id: "report-row-finalized-0"
- waitForAnimationToEnd

# Open actions menu
- tapOn:
    point: "95%,6%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Report actions"
    timeout: 3000

# Tap View PDF (stub — optional tap)
- tapOn:
    text: "View PDF"
    optional: true
- waitForAnimationToEnd

# Back out
- tapOn:
    id: "btn-back"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml

- runFlow: ../subflows/assert-no-error.yaml
