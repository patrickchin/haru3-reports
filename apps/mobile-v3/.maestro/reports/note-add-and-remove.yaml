# Reports: Add multiple text notes and verify they appear in timeline
#
# v3 note: inline delete for text notes may not be available yet.
# This flow only verifies addition.
appId: com.harpa.pro.v3
tags:
  - reports
  - positive
env:
  PROJECT_NAME: "Note CRUD"
  PROJECT_ADDRESS: "205 Rpt St"
  CLIENT_NAME: "Rpt Notes"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Add first note
- tapOn:
    id: "input-note"
- inputText: "First note"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

# Add second note
- tapOn:
    id: "input-note"
- inputText: "Second note"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

# Add third note
- tapOn:
    id: "input-note"
- inputText: "Third note"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

# Dismiss keyboard to see notes
- hideKeyboard

# Switch to Notes tab to verify all three appear
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd

- assertVisible:
    id: "note-timeline"
- assertVisible: "First note"
- assertVisible: "Second note"
- assertVisible: "Third note"

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
