# Reports: Soft-deleting a draft removes it from the report list
#
# PLACEHOLDER — v3 does not yet have btn-report-delete, btn-draft-menu,
# or btn-delete-draft. This flow creates a draft with content to verify
# the setup works, but skips the actual delete assertion.
#
# When report delete is implemented in v3, replace the placeholder
# section with the delete + assertNotVisible steps.
appId: com.harpa.pro.v3
tags:
  - reports
  - positive
env:
  PROJECT_NAME: "Rpt SoftDel"
  PROJECT_ADDRESS: "231 Rpt St"
  CLIENT_NAME: "Rpt SoftDel Co"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Add a text note so the draft has content
- tapOn:
    id: "input-note"
- inputText: "Typed note before delete"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

# Switch to Notes tab and verify content exists
- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- assertVisible: "Typed note before delete"

# TODO: When btn-draft-menu / btn-delete-draft are implemented in v3,
# add the delete flow here:
#   - tapOn: id: "btn-draft-menu"
#   - tapOn: id: "btn-delete-draft"
#   - tapOn: id: "dialog-action-0"
#   - assertNotVisible: id: "report-row-draft-0"

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
