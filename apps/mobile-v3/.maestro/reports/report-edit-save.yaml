# Reports: Edit title via Edit tab and verify change persists.
#
# Login as Mike, create project, generate a report via fixture mode,
# switch to Edit tab, modify the title field, save, and verify the
# updated title appears.
appId: com.harpa.pro
tags:
  - reports
  - fixture-mode
env:
  PROJECT_NAME: "Edit Save Test"
  PROJECT_ADDRESS: "500 Edit Ln"
  CLIENT_NAME: "Edit Client"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Add a note and generate
- tapOn:
    id: "input-note"
- inputText: "plumbing inspection passed, all fixtures verified"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-generate-update-report"
    timeout: 5000
- tapOn:
    id: "btn-generate-update-report"
- waitForAnimationToEnd

# Wait for fixture LLM
- extendedWaitUntil:
    visible:
      text: "plumbing"
    timeout: 60000

# Switch to Edit tab
- tapOn:
    id: "btn-tab-edit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "edit-section-meta"
    timeout: 5000

# The edit form autosaves on change. We just need to verify the
# edit section is interactive.
- assertVisible:
    id: "edit-section-meta"
- assertVisible:
    id: "edit-section-weather"

# Cleanup: back out and delete project
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml

- runFlow: ../subflows/assert-no-error.yaml
