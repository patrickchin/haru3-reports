# Reports: Delete a report via menu and verify navigation back
#
# Login as Mike, create project, generate a report via fixture mode,
# open the finalized report, tap menu > Delete > confirm, verify we
# return to the reports list.
appId: com.harpa.pro.v3
tags:
  - reports
  - smoke
  - fixture-mode
env:
  PROJECT_NAME: "Delete Test"
  PROJECT_ADDRESS: "600 Delete Dr"
  CLIENT_NAME: "Delete Client"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Add a note and generate
- tapOn:
    id: "input-note"
- inputText: "scaffolding erected, safety check done"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-generate-update-report"
    timeout: 5000
- tapOn:
    id: "btn-generate-update-report"
- waitForAnimationToEnd

# Wait for fixture LLM
- extendedWaitUntil:
    visible:
      text: "scaffolding"
    timeout: 60000

# Finalize
- scrollUntilVisible:
    element:
      text: "Finalize Report"
    direction: DOWN
    speed: 80
    timeout: 15000
    visibilityPercentage: 30
- tapOn:
    id: "btn-finalize-report"
- waitForAnimationToEnd

# Open finalized report
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- tapOn:
    id: "report-row-finalized-0"
- waitForAnimationToEnd

# Open menu and delete
- tapOn:
    text: "Report"
- waitForAnimationToEnd

# Tap the MoreVertical menu icon (it's a Pressable without a testID,
# so we use the text from the dialog title to confirm the menu opened)
- tapOn:
    point: "95%,6%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Report actions"
    timeout: 3000

# Tap "Delete report"
- tapOn:
    text: "Delete report"
- waitForAnimationToEnd

# Confirm deletion dialog
- extendedWaitUntil:
    visible:
      text: "Delete report?"
    timeout: 3000
- tapOn:
    text: "Delete"
- waitForAnimationToEnd

# Verify we navigated back to Reports list
- extendedWaitUntil:
    visible:
      text: "Reports"
    timeout: 8000
- assertVisible:
    id: "btn-new-report"

# Cleanup: back out and delete project
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
