# Reports: Verify Edit tab renders the edit form
#
# Login as Mike, create project, generate a report via fixture mode,
# open the completed report, tap Edit tab, verify form sections render.
appId: com.harpa.pro
tags:
  - reports
  - smoke
  - fixture-mode
env:
  PROJECT_NAME: "Edit Tab Test"
  PROJECT_ADDRESS: "500 Edit Ln"
  CLIENT_NAME: "Edit Client"
---
- runFlow: ../subflows/login-mike-otp.yaml
- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: "${PROJECT_NAME}"
      PROJECT_ADDRESS: "${PROJECT_ADDRESS}"
      CLIENT_NAME: "${CLIENT_NAME}"

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- runFlow: ../subflows/create-draft-report.yaml

# Add a note and generate
- tapOn:
    id: "input-note"
- inputText: "roof inspection passed, minor cracks in north wall"
- tapOn:
    id: "btn-add-note"
- waitForAnimationToEnd

- tapOn:
    id: "btn-tab-notes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-generate-update-report"
    timeout: 5000
- tapOn:
    id: "btn-generate-update-report"
- waitForAnimationToEnd

# Wait for fixture LLM
- extendedWaitUntil:
    visible:
      text: "roof"
    timeout: 60000

# Finalize
- scrollUntilVisible:
    element:
      text: "Finalize Report"
    direction: DOWN
    speed: 80
    timeout: 15000
    visibilityPercentage: 30
- tapOn:
    id: "btn-finalize-report"
- waitForAnimationToEnd

# Open finalized report
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- tapOn:
    id: "report-row-finalized-0"
- waitForAnimationToEnd

# Tap Edit tab
- tapOn:
    id: "btn-tab-edit"
- waitForAnimationToEnd

# Verify edit form sections render
- extendedWaitUntil:
    visible:
      id: "edit-section-meta"
    timeout: 5000
- assertVisible:
    id: "edit-section-weather"
- scrollUntilVisible:
    element:
      id: "edit-section-issues"
    direction: DOWN
    speed: 80
    timeout: 10000
    visibilityPercentage: 30

# Cleanup
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd
- runFlow: ../subflows/delete-current-project.yaml
