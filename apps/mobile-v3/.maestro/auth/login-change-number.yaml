# Auth: Tap "Change number" returns to phone input.
appId: com.harpa.pro
tags:
  - auth
  - fixture
---
- runFlow: ../subflows/ensure-logged-out.yaml

- tapOn:
    id: "input-phone"
- eraseText:
    charactersToErase: 20
- inputText: "5551234567"
- hideKeyboard
- tapOn: "Continue"

- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 5000

- tapOn:
    id: "btn-login-change-number"
- waitForAnimationToEnd

# Back on login screen.
- assertNotVisible:
    id: "input-otp"
- assertVisible: "Continue"
- assertVisible:
    id: "input-phone"
