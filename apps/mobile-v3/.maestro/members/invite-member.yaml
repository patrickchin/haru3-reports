# Members: Invite a member via Add Member sheet.
appId: com.harpa.pro
tags:
  - members
  - fixture
env:
  PROJECT_NAME: "Invite Member Project"
  PROJECT_ADDRESS: "400 Invite St"
  CLIENT_NAME: "Invite Client"
---
- runFlow: ../subflows/login-mike-otp.yaml

- runFlow:
    file: ../subflows/create-project.yaml
    env:
      PROJECT_NAME: ${PROJECT_NAME}
      PROJECT_ADDRESS: ${PROJECT_ADDRESS}
      CLIENT_NAME: ${CLIENT_NAME}

- tapOn:
    id: "project-row-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn-open-members"
    timeout: 8000

- tapOn:
    id: "btn-open-members"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Members"
    timeout: 8000

# Open Add Member sheet.
- tapOn:
    id: "btn-add-member"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Add Member"
    timeout: 5000

# Fill phone and select role.
- tapOn:
    id: "input-member-phone"
- inputText: "+15559876543"
- tapOn:
    id: "btn-role-viewer"

# Submit.
- tapOn:
    id: "btn-submit-member"
- waitForAnimationToEnd

# Sheet should close; verify we're back on members list.
- extendedWaitUntil:
    visible: "Members"
    timeout: 8000
