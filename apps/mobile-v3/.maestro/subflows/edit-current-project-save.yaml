# Shared subflow: edit the currently-open project's name and tap Save.
#
# Exercises `btn-save-project` end-to-end (handler + UPDATE round-trip).
# Expects the user to be on the project overview screen with
# `btn-edit-project` visible. Leaves the user back on the overview after
# the save completes (the screen auto-navigates back via router.back()
# in the mutation's onSuccess).
#
# Why this exists: the press-test coverage gate
# (apps/mobile/__tests-config__/press-test-coverage.test.ts) requires
# every risky button to be exercised by either a unit press-test or a
# Maestro flow. Save is risky (mutation) but isn't tapped by any other
# flow — every other test that opens the edit screen goes straight to
# delete. This subflow plugs that gap.
appId: com.harpa.pro.v3
---
- tapOn:
    id: "btn-edit-project"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "input-edit-project-name"
    timeout: 8000
# Append a single character to force a non-no-op UPDATE.
- tapOn:
    id: "input-edit-project-name"
- eraseText
- inputText: "Renamed Project"
- hideKeyboard
- tapOn:
    id: "btn-save-project"
- waitForAnimationToEnd
# After save, the edit screen auto-navigates back to the project
# overview (btn-edit-project re-appears).
- extendedWaitUntil:
    visible:
      id: "btn-edit-project"
    timeout: 8000
